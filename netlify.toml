# dinakhedr.com — Netlify configuration
# Static site: no build command, publish the repository root.

[build]
  publish = "."

# ---------------------------------------------------------------
# Private project files — never serve them publicly
# ---------------------------------------------------------------
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------
# Merged case studies (20 Oct 2026): WUZZUF Internship Program and
# Google & Udacity Scholarship are now one page, WUZZUF Ecosystem Programs
# ---------------------------------------------------------------
[[redirects]]
  from = "/work/wuzzuf-internship-program/*"
  to = "/work/wuzzuf-programs/"
  status = 301
  force = true

[[redirects]]
  from = "/work/google-udacity-scholarship/*"
  to = "/work/wuzzuf-programs/"
  status = 301
  force = true

# ---------------------------------------------------------------
# Old site (HubSpot) → new site
# Specific rules first; Netlify uses the first match.
# ---------------------------------------------------------------

# Portfolio and programs pages are now the Work library
[[redirects]]
  from = "/portfolio"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/programs"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/programs/*"
  to = "/work/"
  status = 301

# Old blog articles whose address changed
[[redirects]]
  from = "/blog/why-your-startup-meetings-suck-and-how-to-fix-them"
  to = "/blog/why-startup-meetings-fail-and-how-to-fix-them/"
  status = 301

[[redirects]]
  from = "/blog/5-must-have-marketing-videos-for-your-business-in-2025"
  to = "/blog/5-must-have-marketing-videos-for-your-business/"
  status = 301

[[redirects]]
  from = "/blog/positioning-vs.-promotion-why-most-startups-get-it-wrong"
  to = "/blog/positioning-vs-promotion/"
  status = 301

# Old blog tag, author and paging pages
[[redirects]]
  from = "/blog/tag/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/author/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/page/*"
  to = "/blog/"
  status = 301

# Articles moved from /insights/ to /blog/ (Nov 2026); all other old
# blog articles kept their slug, so /blog/<slug>/ is served directly.
[[redirects]]
  from = "/insights"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/insights/"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/insights/*"
  to = "/blog/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------
# Headers
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Images, icons and fonts change rarely: cache for 30 days.
# CSS and JS keep Netlify's default (always revalidate) because their file names do not change.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/contact/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Keep the CV out of search results (it stays downloadable from the site).
[[headers]]
  for = "/assets/docs/dina-khedr-cv.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
